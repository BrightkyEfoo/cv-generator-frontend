<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Document icon -->
  <g transform="translate(5, 5)">
    <!-- Main document shape -->
    <path d="M5 0 L25 0 L35 10 L35 40 L5 40 Z" fill="url(#orangeGradient)" />
    <!-- Folded corner -->
    <path d="M25 0 L25 10 L35 10 Z" fill="#ea580c" opacity="0.7" />
    <!-- Lines representing text -->
    <rect x="10" y="16" width="18" height="2" rx="1" fill="white" opacity="0.9" />
    <rect x="10" y="22" width="15" height="2" rx="1" fill="white" opacity="0.7" />
    <rect x="10" y="28" width="20" height="2" rx="1" fill="white" opacity="0.7" />
    <rect x="10" y="34" width="12" height="2" rx="1" fill="white" opacity="0.5" />
  </g>

  <!-- CV text -->
  <text x="50" y="35" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="url(#orangeGradient)">CV</text>

  <!-- Generator text -->
  <text x="82" y="35" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="300" fill="url(#blueGradient)">Generator</text>
</svg>
